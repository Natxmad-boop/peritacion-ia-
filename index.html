<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peritación Inteligente - Star Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between overflow-hidden select-none font-sans">

  <!-- CABECERA DE ESTADO -->
  <header class="p-4 bg-slate-900/90 border-b border-slate-800 flex justify-between items-center z-10 backdrop-blur">
    <div>
      <span class="text-[10px] font-bold text-blue-400 tracking-wider uppercase">Mutua Madrileña · Peritación IA</span>
      <h1 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
        <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusText">Cámara lista para peritar</span>
      </h1>
    </div>
    <span class="bg-blue-900/40 text-blue-300 border border-blue-700/50 text-[11px] px-2 py-0.5 rounded font-mono font-bold">Star Online</span>
  </header>

  <!-- VISOR DE CÁMARA Y DETECCIÓN -->
  <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
    <!-- Stream de vídeo de la cámara trasera -->
    <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover"></video>
    
    <!-- Lienzo sobre el que se dibujan las cajas de los daños -->
    <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>

    <!-- HUD de encuadre pericial -->
    <div class="absolute inset-6 border border-emerald-400/40 rounded-xl pointer-events-none flex flex-col justify-between p-3">
      <span class="text-[10px] font-mono text-emerald-400 bg-slate-950/80 px-2 py-1 rounded w-fit">Encuadre: 1.5 - 2.0 m</span>
      <div id="resultBox" class="hidden self-center bg-slate-900/95 border border-emerald-500 rounded-xl p-3 text-xs text-center backdrop-blur shadow-2xl">
        <p id="damageTitle" class="font-bold text-emerald-400 text-sm">✓ Análisis completado</p>
        <p id="damageDetails" class="text-[11px] text-slate-300 mt-1">Calculando baremo de reparación...</p>
      </div>
      <span class="text-[10px] font-mono text-slate-400 self-center">Apunta a la zona dañada de la carrocería</span>
    </div>
  </main>

  <!-- PANEL DE DISPARO -->
  <footer class="p-6 bg-slate-900/90 border-t border-slate-800 flex flex-col items-center gap-2 z-10 backdrop-blur">
    <button id="captureBtn" class="w-16 h-16 rounded-full border-4 border-emerald-400 bg-emerald-500 active:scale-95 transition-all text-slate-950 font-bold text-2xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
      📸
    </button>
    <span class="text-[11px] text-slate-400 font-mono">Pulsar para escanear chapa y pintura</span>
  </footer>

  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const captureBtn = document.getElementById('captureBtn');
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');
    const resultBox = document.getElementById('resultBox');
    const damageDetails = document.getElementById('damageDetails');

    // CONFIGURACIÓN DE ROBOFLOW
    const ROBOFLOW_MODEL = "car-damage-detection-5"; 
    const ROBOFLOW_API_KEY = "TU_API_KEY_AQUI"; 

    // 1. Iniciar la cámara trasera del smartphone
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        };
      } catch (err) {
        alert("Por favor, permite el acceso a la cámara para poder peritar el vehículo.");
        statusText.innerText = "Error: Cámara bloqueada";
        statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-red-500";
      }
    }

    // 2. Capturar fotograma y enviar a la IA
    captureBtn.addEventListener('click', async () => {
      statusText.innerText = "Analizando con IA de daños...";
      statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-spin";

      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = video.videoWidth;
      snapCanvas.height = video.videoHeight;
      const snapCtx = snapCanvas.getContext('2d');
      snapCtx.drawImage(video, 0, 0);
      const base64Image = snapCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      try {
        const response = await fetch(`https://detect.roboflow.com/${ROBOFLOW_MODEL}/1?api_key=${ROBOFLOW_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: base64Image
        });
        
        const data = await response.json();
        renderDetections(data.predictions);
      } catch (error) {
        console.warn("API no configurada, ejecutando simulación.");
        simulateDetection();
      }
    });

    // 3. Dibujar cajas de daños
    function renderDetections(predictions) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (!predictions || predictions.length === 0) {
        statusText.innerText = "No se aprecian daños evidentes";
        statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        resultBox.classList.remove('hidden');
        damageDetails.innerHTML = "Estado: <span class='text-emerald-400 font-bold'>Pieza Conforme</span> (Sin deformaciones)";
        return;
      }

      predictions.forEach(p => {
        const x = p.x - p.width / 2;
        const y = p.y - p.height / 2;

        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, p.width, p.height);

        ctx.fillStyle = "#ef4444";
        ctx.fillRect(x, y - 24, p.width, 24);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(`${p.class.toUpperCase()} (${Math.round(p.confidence * 100)}%)`, x + 6, y - 6);
      });

      resultBox.classList.remove('hidden');
      damageDetails.innerHTML = `Detectados: <span class='text-red-400 font-bold'>${predictions.length} daños</span><br>Alineado con baremo de reparación`;
      statusText.innerText = "Daños identificados";
      statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-red-400";
    }

    function simulateDetection() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width * 0.4;
      const h = canvas.height * 0.25;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;

      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 4;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x, y - 26, w, 26);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText("ABOLLADURA CHAPA (89%)", x + 8, y - 8);

      resultBox.classList.remove('hidden');
      damageDetails.innerHTML = "Detectado: <span class='text-red-400 font-bold'>Abolladura Leve</span><br>Baremo: Pintura nivel 2";
      statusText.innerText = "Inspección completada";
      statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
    }

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
