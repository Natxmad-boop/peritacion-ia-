<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peritación IA (Local)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background-color: #020617; overscroll-behavior: none; }
    #cameraFeed { width: 100%; height: 100%; object-fit: cover; }
    #overlayCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body class="text-white flex flex-col h-[100dvh] w-screen overflow-hidden select-none font-sans">

  <header class="p-4 bg-slate-900/95 border-b border-slate-800 flex justify-between items-center z-20 w-full shrink-0">
    <div>
      <span class="text-[10px] font-bold text-blue-400 tracking-wider uppercase">Peritación Inteligente</span>
      <h1 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
        <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusText">Cargando IA local...</span>
      </h1>
    </div>
  </header>

  <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden w-full">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
    <div id="flashEffect" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>
    
    <div class="absolute inset-4 border border-emerald-400/40 rounded-xl pointer-events-none flex flex-col justify-between p-3 z-10">
      <span class="text-[10px] font-mono text-emerald-400 bg-slate-950/80 px-2 py-1 rounded w-fit">Encuadre: 1.5 - 2.0 m</span>
      <div id="resultBox" class="hidden self-center bg-slate-900/95 border-2 border-emerald-500 rounded-xl p-4 text-xs text-center backdrop-blur shadow-2xl transition-all duration-300" style="transform: scale(0);">
        <p id="damageTitle" class="font-bold text-emerald-400 text-sm">✓ Análisis completado</p>
        <p id="damageDetails" class="text-[11px] text-slate-300 mt-1">...</p>
      </div>
      <span class="text-[10px] font-mono text-slate-400 self-center mb-2">Apunta a la zona dañada</span>
    </div>
  </main>

  <footer class="p-5 pb-8 bg-slate-900 border-t border-slate-800 flex flex-col items-center justify-center gap-3 z-20 w-full shrink-0">
    <button id="captureBtn" disabled class="w-20 h-20 rounded-full border-4 border-emerald-400 bg-emerald-500 active:scale-95 transition-all text-slate-950 font-bold text-3xl flex items-center justify-center shadow-lg shadow-emerald-500/50 disabled:opacity-50 disabled:bg-gray-500">
      📸
    </button>
    <button id="downloadBtn" class="hidden mt-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white text-sm font-bold py-2 px-6 rounded-full transition-all">
      💾 Guardar Foto Analizada
    </button>
    <span class="text-[11px] text-slate-400 font-mono uppercase tracking-widest mt-1">Escanear Daños</span>
  </footer>

  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const captureBtn = document.getElementById('captureBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');
    const resultBox = document.getElementById('resultBox');
    const damageDetails = document.getElementById('damageDetails');
    const flashEffect = document.getElementById('flashEffect');

    let session = null;
    let lastAnalyzedCanvas = null; 
    const CLASS_NAMES = ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light"];

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        };
      } catch (err) {
        alert("Permite el acceso a la cámara.");
        statusText.innerText = "Error: Cámara bloqueada";
        statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-red-500";
      }
    }

    async function loadModel() {
      try {
        statusText.innerText = "Cargando modelo de IA...";
        // RUTA CORREGIDA: Busca el archivo en la misma carpeta de GitHub
        const response = await fetch('./yolov8n.onnx');
        
        if (!response.ok) throw new Error("No se encuentra el archivo");
        
        const modelBuffer = await response.arrayBuffer();
        
        session = await ort.InferenceSession.create(modelBuffer, {
            executionProviders: ['wasm']
        });
        
        statusText.innerText = "IA lista. Apunta y dispara.";
        statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        captureBtn.disabled = false;
      } catch (e) {
        console.error(e);
        statusText.innerText = "Error al cargar el modelo";
        statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-red-500";
      }
    }

    captureBtn.addEventListener('click', async () => {
      if (!session) return;
      
      downloadBtn.classList.add('hidden');
      
      flashEffect.style.opacity = '1';
      setTimeout(() => flashEffect.style.opacity = '0', 150);
      statusText.innerText = "Analizando en el móvil...";
      statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping";
      resultBox.classList.add('hidden');

      lastAnalyzedCanvas = document.createElement('canvas');
      lastAnalyzedCanvas.width = video.videoWidth;
      lastAnalyzedCanvas.height = video.videoHeight;
      const lastCtx = lastAnalyzedCanvas.getContext('2d');
      lastCtx.drawImage(video, 0, 0);

      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = 640;
      snapCanvas.height = 640;
      const snapCtx = snapCanvas.getContext('2d');
      snapCtx.drawImage(video, 0, 0, 640, 640);

      const imgData = snapCtx.getImageData(0, 0, 640, 640);
      const data = new Float32Array(3 * 640 * 640);
      for (let i = 0; i < 640 * 640; i++) {
        data[i] = imgData.data[i * 4] / 255.0;
        data[i + 640 * 640] = imgData.data[i * 4 + 1] / 255.0;
        data[i + 2 * 640 * 640] = imgData.data[i * 4 + 2] / 255.0;
      }
      
      const tensor = new ort.Tensor('float32', data, [1, 3, 640, 640]);
      
      try {
        const results = await session.run({ images: tensor });
        const output = results.output0.data;
        
        let maxConf = 0;
        let bestClass = -1;
        for (let i = 0; i < 8400; i++) {
            for (let c = 0; c < 80; c++) {
                const conf = output[4 + c + i * 84];
                if (conf > maxConf) {
                    maxConf = conf;
                    bestClass = c;
                }
            }
        }
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        resultBox.classList.remove('hidden');
        setTimeout(() => resultBox.style.transform = 'scale(1)', 10);
        
        if (maxConf > 0.5 && bestClass >= 0 && bestClass < CLASS_NAMES.length) {
            const label = CLASS_NAMES[bestClass];
            damageDetails.innerHTML = `Detectado: <span class='text-red-400 font-bold'>${label}</span> (${Math.round(maxConf * 100)}%)`;
            statusText.innerText = "Objeto detectado";
            statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-blue-400";
        } else {
            damageDetails.innerHTML = `No se detectó nada con claridad`;
            statusText.innerText = "Análisis completado";
            statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        }

        downloadBtn.classList.remove('hidden');

      } catch (e) {
        console.error(e);
        statusText.innerText = "Error en el análisis";
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastAnalyzedCanvas) return;
      
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = lastAnalyzedCanvas.width;
      finalCanvas.height = lastAnalyzedCanvas.height;
      const finalCtx = finalCanvas.getContext('2d');
      
      finalCtx.drawImage(lastAnalyzedCanvas, 0, 0);
      finalCtx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'peritacion-coche.jpg';
      link.href = finalCanvas.toDataURL('image/jpeg', 0.9);
      link.click();
    });

    window.addEventListener('load', async () => {
        await initCamera();
        await loadModel();
    });
  </script>
</body>
</html>
